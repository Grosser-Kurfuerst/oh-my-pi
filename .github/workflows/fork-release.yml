name: Fork sync & release

# Merges upstream's newest stable release tag into the fork's `custom` branch,
# builds the linux-x64 binary, publishes it as a GitHub release, and updates the
# static build index on the `build-index` branch that the fork's omp updates from.

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时检查一次上游发布
  workflow_dispatch:
  push:
    branches: [custom]       # 你自己的改动推上来时也重新构建

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_URL: https://github.com/can1357/oh-my-pi.git
  BUILD_TARGET: linux-x86_64   # build-service.ts resolveBuildHost 的 target
  BINARY_NAME: omp-linux-x64   # resolveBuildHost 的 fileName
  # 预编译 natives 插件在 npm 上的地址前缀，后面接 -<版本>.tgz
  NATIVES_TARBALL: https://registry.npmjs.org/@oh-my-pi/pi-natives-linux-x64/-/pi-natives-linux-x64

jobs:
  sync-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      # 有 upstream remote 时 gh 会优先把它当目标仓库，必须显式指定 fork 本身
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 只跟上游已发到 npm 的稳定版 tag（排除 v*-canary.*），保证版本号与 npm 上的 natives 对得上
      # 用 merge 而非 rebase：custom 只追加不改写，CI 普通 push，本地普通 pull 即可
      - name: Merge latest upstream release
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/v*'
          # awk 读完全部输入再取第一个稳定版；用 head 提前关管道会让 grep 在 runner 上
          # 报 Broken pipe（runner 忽略 SIGPIPE），配合 pipefail 使整步以 exit 2 失败
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | awk '!/-/ && !found { print; found = 1 }')
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "custom already contains $latest"
            exit 0
          fi
          # 上游先推 tag，CI 测试全过才发 npm，测试失败时 tag 会一直没有对应的 natives。
          # 这时先不合并，照常构建当前的 custom，等下次运行再试
          if ! curl -fsIL --retry 3 -o /dev/null "${NATIVES_TARBALL}-${latest#v}.tgz"; then
            echo "::notice::$latest is tagged but its natives are not on npm yet; skipping the merge."
            exit 0
          fi
          if ! git merge --no-ff --no-edit -m "chore(fork): merge upstream $latest" "$latest"; then
            git merge --abort
            echo "::error::Merging $latest conflicts; merge it into custom locally and push."
            exit 1
          fi
          git push origin HEAD:custom

      # fork 版本号：刚合并完上游时就是上游版本 X.Y.Z；之后每个 fork 提交为
      # X.Y.(Z+1)-kf.N，N 是上游合并之后 custom 第一父链上的提交数。
      # 这样只改 fork 代码也会比上一次构建高，而上游的 X.Y.(Z+1) 正式版又比它高。
      # 每个 commit 对应一个唯一的 release tag，已构建过就跳过
      - name: Resolve build id
        id: meta
        run: |
          set -euo pipefail
          # natives 的版本号始终是上游版本，npm 上的预编译插件按它下载，构建时也不改它
          base=$(jq -r .version packages/natives/package.json)
          tag_commit=$(git rev-parse "v${base}^{commit}")
          # 第一父链上也有上游自己的合并提交，要找第二父提交正好是这个 tag 的那次合并
          merge=$(git rev-list --first-parent --merges --parents HEAD \
            | awk -v t="$tag_commit" '$3 == t && !found { print $1; found = 1 }')
          if [ -z "$merge" ]; then
            echo "::error::No merge of v$base found on custom's first-parent history."
            exit 1
          fi
          count=$(git rev-list --count --first-parent "$merge..HEAD")
          if [ "$count" -eq 0 ]; then
            version="$base"
          else
            IFS=. read -r major minor patch <<< "$base"
            version="${major}.${minor}.$((patch + 1))-kf.${count}"
          fi
          tag="kf-v${version}-$(git rev-parse --short=8 HEAD)"
          echo "Fork version $version (upstream $base)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.meta.outputs.skip == 'false'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.meta.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Install prebuilt native addons from npm
        if: steps.meta.outputs.skip == 'false'
        env:
          BASE_VERSION: ${{ steps.meta.outputs.base }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "${NATIVES_TARBALL}-${BASE_VERSION}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/package/pi_natives.linux-x64-{baseline,modern}.node packages/natives/native/

      # omp 的 VERSION 只来自 packages/utils/package.json。只在构建机上改，不提交：
      # 提交的话每次合并上游都会在 version 行冲突。放在 bun install 之后，避免 --frozen-lockfile 失败。
      # natives 的 package.json 不能改，embed-native 会核对插件里的版本戳。
      - name: Stamp fork version
        if: steps.meta.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' packages/utils/package.json > "$RUNNER_TEMP/utils-package.json"
          mv "$RUNNER_TEMP/utils-package.json" packages/utils/package.json

      # 二进制报告的版本必须等于索引里的版本，否则 omp 会一直提示有更新
      - name: Build binary
        if: steps.meta.outputs.skip == 'false'
        env:
          RELEASE_TARGETS: linux-x64
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          bun run ci:release:build-binaries
          reported=$("packages/coding-agent/binaries/$BINARY_NAME" --version)
          if [ "$reported" != "omp/$VERSION" ]; then
            echo "::error::Binary reports $reported, expected omp/$VERSION."
            exit 1
          fi

      # 先发 release 再写索引，索引永远不会指向不存在的文件
      - name: Publish GitHub release
        if: steps.meta.outputs.skip == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BASE_VERSION: ${{ steps.meta.outputs.base }}
        run: |
          gh release create "$TAG" "packages/coding-agent/binaries/$BINARY_NAME" \
            --target "$(git rev-parse HEAD)" \
            --title "omp $VERSION (fork $(git rev-parse --short=8 HEAD))" \
            --notes "Based on upstream v$BASE_VERSION." \
            --latest

      - name: Update build index
        if: steps.meta.outputs.skip == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          bin="$PWD/packages/coding-agent/binaries/$BINARY_NAME"
          size=$(stat -c%s "$bin")
          sha=$(sha256sum "$bin" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${BINARY_NAME}"
          answer=$(jq -n --arg v "$VERSION" --arg n "$BINARY_NAME" --argjson s "$size" --arg h "$sha" --arg u "$url" \
            '{build: {version: $v}, file: {name: $n, size: $s, sha256: $h}, download: $u}')
          git worktree add "$RUNNER_TEMP/index" origin/build-index
          cd "$RUNNER_TEMP/index"
          for p in "api/products/omp/latest/$BUILD_TARGET" "api/products/omp/versions/$VERSION/$BUILD_TARGET"; do
            mkdir -p "$(dirname "$p")"
            printf '%s\n' "$answer" > "$p"
          done
          git add api
          git commit -m "chore(build-index): publish $TAG"
          git push origin HEAD:build-index

      # 只保留最近 3 个 fork release，每个约 250MB
      - name: Prune old releases
        if: steps.meta.outputs.skip == 'false'
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^kf-v' | tail -n +4 \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
